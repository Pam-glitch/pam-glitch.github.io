<script>
var graphView = document.getElementById('map-graph-view');
var listView = document.getElementById('map-list-view');
var showGraphBtn = document.getElementById('show-graph');
var showListBtn = document.getElementById('show-list');

showGraphBtn.addEventListener('click', function(){
  graphView.style.display = 'block';
  listView.style.display = 'none';
  showGraphBtn.classList.add('active');
  showListBtn.classList.remove('active');
});
showListBtn.addEventListener('click', function(){
  graphView.style.display = 'none';
  listView.style.display = 'block';
  showListBtn.classList.add('active');
  showGraphBtn.classList.remove('active');

// Families: color + short label only. Order follows standard
// orchestral score order: woodwinds, brass, percussion, then the
// "Others" tier (keys, voice, electronics), then strings — then the
// non-instrument categories after.
var families = [
  {id:'winds', label:'winds', color:'#00c2c2'},
  {id:'brass', label:'brass', color:'#ff9500'},
  {id:'percussion', label:'percussion', color:'#ff5722'},
  {id:'keys', label:'keys', color:'#2ecc40'},

  {id:'electronics', label:'electronics', color:'#9013fe'},
  {id:'strings', label:'strings', color:'#3d5afe'},
  {id:'orchestra', label:'orchestra', color:'#2196f3'},
  {id:'interdisciplinary', label:'interdisciplinary', color:'#4a4a4a'},
  {id:'collabs', label:'collabs', color:'#ff00c8'}
];

var pieces = [
  {id:'p1', label:'Wind Quintet', links:['winds'], year:'2026', forr:'wind quintet', where:'Kammermusikkveka 2026, Norwegian Academy of Music'},
  {id:'p2', label:'Sax solo', fullLabel:'Solo piece for Saxophone', links:['winds'], year:'2026', forr:'saxophone (Gudrun Faleide Fristad)', where:'Premiere 7 Aug; touring La Plata, Ushuaia, Cajamarca from 24 Aug'},
  {id:'p3', label:'Erbe Selvatiche', links:['winds'], year:'2026', forr:'bass clarinet (Madara Elena Mezale)', where:'Norwegian Academy of Music, 24 March'},
  {id:'p4', label:'Corpo', links:['winds','electronics'], year:'2025', forr:'electroacoustic, ambisonics (w/ saxophonist Gregory Karanekha)', where:'Laidi Palace, Latvia'},
  {id:'p5', label:'Album (2026)', links:['collabs'], year:'2026', forr:'accordion (Kalle Moberg), saxophone (Mario Gabola), vocals', where:'Label: Dissipatio (IT), September 2026'},
  {id:'p6', label:'Trombone solo', fullLabel:'Solo piece for Trombone', links:['brass'], year:'TBA', forr:'trombone (Guro Kitterød)', where:'TBA'},
  {id:'p7', label:'Richiamo', links:['brass','percussion','electronics'], year:'2025', forr:'trombone, tam-tam, transducer (Guro Kitterød)', where:'Sonisk Hage Festival, Galleri Sagene Kunstsmie'},
  {id:'p8', label:"We're Not Really Strangers", links:['strings','keys'], year:'2026', forr:'cello, two pianos', where:'Norwegian Academy of Music, 16 March'},

  {id:'p11', label:'In Acqua', links:['voice'], year:'2024', forr:'choir', where:'JVLMA Jauktais Koris, Riga'},
  {id:'p12', label:'By the Grave of the Unknown Queer', links:['orchestra'], year:'2026', forr:'orchestra', where:'Trondheim Symphony Orchestra — workshops Jan & May'},

  {id:'p14', label:'1st Draft: First Lady', links:['interdisciplinary'], year:'2025', forr:'Duo Amoeba', where:'Blitz, Oslo'},

  {id:'p18', label:'Perre alla Diavola', links:['collabs'], year:'2026', note:'Collective with Maria Gabriela Rubio, Vincenzo Madaghiele & Robin Morabito', images:[],
    panelHtml:'<h3><u>Collective Perre alla Diavola</u></h3>' +
      '<p class="meta">Artists</p>' +

    images:[
      {src:'images/work/fittykatta-1.jpg', alt:'Performance still from FiTTyKATTA! Liberation is Erotic'},
      {src:'images/work/fittykatta-2.jpg', alt:'Event poster for FiTTyKATTA! Liberation is Erotic, 11 April 2026 at Boksen, Hausmania'}
    ],
    panelHtml:'<h3>FiTTyKATTA! Liberation is Erotic</h3>' +
      '<p class="meta">2026 — Boksen Noise, Oslo</p>' +

var nodeById = {};
families.forEach(function(f){ nodeById[f.id] = f; });
pieces.forEach(function(p){ nodeById[p.id] = p; });

// ---------- tree layout: deterministic, no physics ----------
// Each family is a row on a vertical spine. Closed rows are compact
// (just the circle). An open row grows tall enough to fit its
// pieces, each piece getting its own dedicated vertical slot — which
// is what guarantees pieces can never overlap: it's not solved for,
// it's built in by construction. Opening or closing a family only
// ever changes that family's own row height; every other row is
// completely unaffected, so nothing else on the page ever moves.
var SPINE_X = 46;
var FAMILY_R = 22;
var PIECE_R = 9;
var CLOSED_ROW_H = 56;
var PIECE_ROW_H = 34;
var ROW_PAD = 16;
var PIECE_X = 190;
var CORNER_R = 7;
var TOP_PAD = 18;
var BOTTOM_PAD = 18;

var MAX_OPEN_FAMILIES = 3;
var expanded = {};
var openOrder = [];
var openPieceId = null;

function piecesFor(familyId){
  // A piece belongs to the first family in ITS OWN link order that's
  // currently open — stable regardless of click order, and each
  // piece only ever occupies one row, never duplicated.
  return pieces.filter(function(p){
    return p.links[0] === familyId ? expanded[familyId] :
      p.links.indexOf(familyId) !== -1 && expanded[familyId] &&
      p.links.filter(function(fid){ return expanded[fid]; })[0] === familyId;
  });
}

function computeLayout(){
  var y = TOP_PAD;
  var rows = [];
  var secondaryFamilyIds = {}; // closed families a visible piece also links to

  families.forEach(function(f){
    var isOpen = !!expanded[f.id];
    var kids = isOpen ? piecesFor(f.id) : [];
    kids.forEach(function(p){
      p.links.forEach(function(fid){ if (fid !== f.id && !expanded[fid]) secondaryFamilyIds[fid] = true; });
    });
    var rowH = isOpen ? Math.max(CLOSED_ROW_H, ROW_PAD * 2 + kids.length * PIECE_ROW_H) : CLOSED_ROW_H;
    rows.push({ family: f, top: y, rowH: rowH, centerY: y + rowH / 2, kids: kids, isOpen: isOpen });
    y += rowH;
  });

  rows.forEach(function(row){
    row.secondary = !row.isOpen && !!secondaryFamilyIds[row.family.id];
    var innerTop = row.top + ROW_PAD;
    var innerH = row.rowH - ROW_PAD * 2;
    row.kids.forEach(function(p, i){
      var slotCenter = row.kids.length === 1
        ? row.centerY
        : innerTop + (innerH / row.kids.length) * (i + 0.5);
      p.treeY = slotCenter;
      p.treeX = PIECE_X;
      p.homeFamily = row.family.id;
    });
  });

  return { rows: rows, totalHeight: y + BOTTOM_PAD };
}

function connectorPath(familyY, pieceY){
  var x1 = SPINE_X + FAMILY_R, x2 = PIECE_X - PIECE_R;
  if (Math.abs(pieceY - familyY) < 0.5) return 'M' + x1 + ',' + familyY + ' L' + x2 + ',' + pieceY;
  var dir = pieceY > familyY ? 1 : -1;
  var midX = x1 + 26;
  var r = CORNER_R;
  return 'M' + x1 + ',' + familyY +
    ' L' + (midX - r) + ',' + familyY +
    ' Q' + midX + ',' + familyY + ' ' + midX + ',' + (familyY + r * dir) +
    ' L' + midX + ',' + (pieceY - r * dir) +
    ' Q' + midX + ',' + pieceY + ' ' + (midX + r) + ',' + pieceY +
    ' L' + x2 + ',' + pieceY;
}

var svg = document.getElementById('tree');
var treeContent = document.getElementById('tree-content');
var treeWrap = document.getElementById('tree-wrap');
var NS = 'http://www.w3.org/2000/svg';

var piecePanel = document.getElementById('piece-panel');
var panelOverlay = document.getElementById('panel-overlay');
var panelImages = document.getElementById('panel-images');
var panelContent = document.getElementById('panel-content');
var panelClose = document.getElementById('panel-close');

function closePanel(){
  openPieceId = null;
  panelOverlay.classList.remove('open');
  panelImages.innerHTML = '';
  panelContent.innerHTML = '';
}
panelClose.addEventListener('click', closePanel);
panelOverlay.addEventListener('click', function(evt){ if (evt.target === panelOverlay) closePanel(); });

function openPanel(piece){
  openPieceId = piece.id;
  panelOverlay.classList.add('open');

  var textHtml = '';
  if (piece.panelHtml) {
    textHtml += piece.panelHtml;
  } else {
    textHtml += '<h3>' + (piece.fullLabel || piece.label) + '</h3>';
    textHtml += '<p class="meta">' + piece.year + '</p>';
    textHtml += '<p>' + piece.forr + '</p>';
    textHtml += '<p class="meta">' + piece.where + '</p>';
  }
  panelContent.innerHTML = textHtml;

  if (piece.images && piece.images.length) {
    var imgHtml = '';
    piece.images.forEach(function(img){
      imgHtml += '<img src="' + img.src + '" alt="' + (img.alt || '') + '">';
    });
    panelImages.innerHTML = imgHtml;
  } else {
    panelImages.innerHTML = '';
  }
}

function toggleFamily(id){
  if (expanded[id]) {
    expanded[id] = false;
    openOrder = openOrder.filter(function(fid){ return fid !== id; });
  } else {
    expanded[id] = true;
    openOrder.push(id);
    while (openOrder.length > MAX_OPEN_FAMILIES) {
      var oldest = openOrder.shift();
      expanded[oldest] = false;
    }
  }
  render();
}

function fitHeight(){
  var top = treeWrap.getBoundingClientRect().top;
  var available = window.innerHeight - top - 24;
  treeWrap.style.height = Math.max(320, available) + 'px';
}

function render(){
  var layout = computeLayout();
  treeContent.innerHTML = '';
  svg.setAttribute('viewBox', '0 0 400 ' + layout.totalHeight);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  layout.rows.forEach(function(row){
    var f = row.family;
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'family-row' + (row.isOpen ? ' expanded' : '') + (row.secondary ? ' secondary' : ''));
    g.style.cursor = 'pointer';

    var circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('cx', SPINE_X); circle.setAttribute('cy', row.centerY); circle.setAttribute('r', FAMILY_R);
    circle.setAttribute('fill', f.color);
    g.appendChild(circle);

    var label = document.createElementNS(NS, 'text');
    label.textContent = f.label;
    label.setAttribute('class', 'f-label');
    label.setAttribute('x', SPINE_X + FAMILY_R + 10);
    label.setAttribute('y', row.centerY);
    label.setAttribute('dominant-baseline', 'central');
    g.appendChild(label);

    g.addEventListener('click', function(){ toggleFamily(f.id); });
    treeContent.appendChild(g);

    row.kids.forEach(function(p){
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', connectorPath(row.centerY, p.treeY));
      path.setAttribute('class', 'connector');
      path.setAttribute('stroke', f.color);
      treeContent.appendChild(path);

      var pg = document.createElementNS(NS, 'g');
      pg.setAttribute('class', 'piece-node');
      pg.style.cursor = 'pointer';

      var pc = document.createElementNS(NS, 'circle');
      pc.setAttribute('cx', p.treeX); pc.setAttribute('cy', p.treeY); pc.setAttribute('r', PIECE_R);
      pg.appendChild(pc);

      var pl = document.createElementNS(NS, 'text');
      pl.textContent = p.fullLabel || p.label;
      pl.setAttribute('class', 'p-label');
      pl.setAttribute('x', p.treeX + PIECE_R + 8);
      pl.setAttribute('y', p.treeY);
      pl.setAttribute('dominant-baseline', 'central');
      pg.appendChild(pl);

      // small colored badge per additional linked family — no line,
      // just a dot naming the connection, so it scales however many
      // families a piece links to without more crossing lines
      var otherLinks = p.links.filter(function(fid){ return fid !== p.homeFamily; });
      otherLinks.forEach(function(fid, i){
        var badge = document.createElementNS(NS, 'circle');
        badge.setAttribute('cx', p.treeX - PIECE_R - 3 - i * 9);
        badge.setAttribute('cy', p.treeY - PIECE_R - 2);
        badge.setAttribute('r', 4);
        badge.setAttribute('fill', nodeById[fid].color);
        var title = document.createElementNS(NS, 'title');
        title.textContent = 'also linked: ' + nodeById[fid].label;
        badge.appendChild(title);
        pg.appendChild(badge);
      });

      pg.addEventListener('click', function(evt){
        evt.stopPropagation();
        openPanel(p);
      });
      treeContent.appendChild(pg);
    });
  });

  fitHeight();
}

window.addEventListener('resize', fitHeight);
render();

// ---------- plain-list view: generated from the same data as the ----------
// graph above, so a new piece only ever needs adding in one place.
// Two orderings: by family (matches the graph's fixed order) and by
// year (chronological; each title gets a small dot in its family's
// colour, but the year headings themselves stay neutral).
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function pieceMetaLine(p){
  if (p.note) return p.note;
  var parts = [];
  if (p.forr) parts.push(p.forr);
  if (p.where) parts.push(p.where);
  return parts.join(' — ');
}

function pieceListItem(p, withDot){
  var dot = withDot
    ? '<span class="piece-dot" style="background-color:' + nodeById[p.links[0]].color + '"></span>'
    : '';
  var meta = pieceMetaLine(p);
  return '<li>' + dot + (p.fullLabel || p.label) +
    (meta ? '<br><span class="meta">' + meta + '</span>' : '') +
    '</li>';
}

function renderListByFamily(){
  var html = '';
  families.forEach(function(f, i){
    var members = pieces.filter(function(p){ return p.links.indexOf(f.id) !== -1; });
    if (!members.length) return;
    html += '<details' + (i === 0 ? ' open' : '') + '>' +
      '<summary style="border-left: 4px solid ' + f.color + '; padding-left: 10px;">' + cap(f.label) + '</summary>' +
      '<ul class="recent">' + members.map(function(p){ return pieceListItem(p, false); }).join('') + '</ul>' +
      '</details>';
  });
  document.getElementById('list-content').innerHTML = html;
}

function renderListByYear(){
  var byYear = {};
  var yearOrder = [];
  pieces.forEach(function(p){
    var y = p.year || 'TBA';
    if (!byYear[y]) { byYear[y] = []; yearOrder.push(y); }
    byYear[y].push(p);
  });
  yearOrder.sort(function(a, b){
    var na = parseInt(a, 10), nb = parseInt(b, 10);
    if (isNaN(na)) return 1;   // non-numeric (TBA) sinks to the end
    if (isNaN(nb)) return -1;
    return nb - na;            // most recent first
  });
  var html = '';
  yearOrder.forEach(function(y, i){
    html += '<details' + (i === 0 ? ' open' : '') + '>' +
      '<summary style="border-left: 4px solid var(--ink); opacity: 0.55; padding-left: 10px;">' + y + '</summary>' +
      '<ul class="recent">' + byYear[y].map(function(p){ return pieceListItem(p, true); }).join('') + '</ul>' +
      '</details>';
  });
  document.getElementById('list-content').innerHTML = html;
}

var showByFamilyBtn = document.getElementById('show-by-family');
var showByYearBtn = document.getElementById('show-by-year');
showByFamilyBtn.addEventListener('click', function(){
  renderListByFamily();
  showByFamilyBtn.classList.add('active');
  showByYearBtn.classList.remove('active');
});
showByYearBtn.addEventListener('click', function(){
  renderListByYear();
  showByYearBtn.classList.add('active');
  showByFamilyBtn.classList.remove('active');
});

renderListByFamily();
</script>
