// ---------- sizing ----------
// Fixed canvas, always. No growing, no shrinking, no dynamic
// resizing based on what's open — that dynamic-sizing behavior is
// what made things feel like they were sprawling and jumping
// around. The tradeoff: in a rare dense case a label might sit
// close to another rather than the whole canvas stretching to avoid
// it. That's an intentional choice, not an oversight.
var VB_W = 680, VB_H = 600;
var CENTER_X = VB_W / 2, CENTER_Y = VB_H / 2;
var FAMILY_R = 18;
var PIECE_R = 5; // small dot; the label sits beside it, not inside it

// ---------- family positions: fixed home ring, orchestral order ----------
var FAMILY_RING = 190;
families.forEach(function(f, i){
  var angle = (i / families.length) * 2 * Math.PI - Math.PI / 2;
  f.x = CENTER_X + FAMILY_RING * Math.cos(angle);
  f.y = CENTER_Y + FAMILY_RING * Math.sin(angle);
  f.homeX = f.x; f.homeY = f.y;
});

var nodeById = {};
families.forEach(function(f){ nodeById[f.id] = Object.assign({type:'family', r: FAMILY_R}, f); });

var edges = [];
pieces.forEach(function(p){ p.links.forEach(function(fid){ edges.push({from:fid, to:p.id}); }); });

// How many pieces are attached to each family — a family with more
// pieces gets a modestly wider ring, so density stays roughly even
// as the catalog grows, without the ring ballooning outward.
var pieceCountByFamily = {};
pieces.forEach(function(p){
  p.links.forEach(function(fid){
    pieceCountByFamily[fid] = (pieceCountByFamily[fid] || 0) + 1;
  });
});
var BASE_LINK_DISTANCE = 60;
var LINK_GROWTH = 14;
function linkDistanceFor(familyId){
  var count = pieceCountByFamily[familyId] || 1;
  return BASE_LINK_DISTANCE + LINK_GROWTH * Math.sqrt(count);
}

pieces.forEach(function(p){ nodeById[p.id] = Object.assign({type:'piece', r: PIECE_R, x: 0, y: 0}, p); });

// ---------- label sizing helpers ----------
// Still used to size things and to do a single, bounded pass at
// keeping labels apart — just no longer the engine that decides
// where anything lives. Placement below is direct and geometric;
// this is only for the light cleanup pass after.
function approxLabelWidth(str){
  return Math.max(24, str.length * 6.4 + 6);
}
var LABEL_HALF_H = 9;
var LABEL_GAP = 5;

function pieceLabelBox(n){
  var w = approxLabelWidth(n.fullLabel || n.label);
  n.labelSide = n.x >= CENTER_X ? 1 : -1;
  var left, right;
  if (n.labelSide === 1) { left = n.x - n.r; right = n.x + n.r + 8 + w; }
  else { left = n.x - n.r - 8 - w; right = n.x + n.r; }
  return { left: left, right: right, top: n.y - LABEL_HALF_H, bottom: n.y + LABEL_HALF_H };
}

function familyLabelBox(f){
  var w = approxLabelWidth(f.label);
  return {
    left: f.x - Math.max(f.r, w / 2) - 4,
    right: f.x + Math.max(f.r, w / 2) + 4,
    top: f.y - f.r - 24,
    bottom: f.y + f.r
  };
}

function boxesOverlap(a, b){
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}

// ---------- piece placement: direct, one-shot, geometric ----------
// No physics, no iteration, no convergence loop. Each visible piece
// is placed on a fixed ring around whichever of its families is
// actually open (the first one, in that piece's own link order, so
// it's stable regardless of click order) — evenly spaced by angle
// among its siblings on that same ring. That's the whole algorithm.
// It's what makes the result predictable: the same open families
// always produce the same layout, and nothing can wander far from
// home chasing a perfect solve.
function placePiecesDirect(visiblePieces){
  var byFamily = {};
  visiblePieces.forEach(function(p){
    var anchorId = p.links.filter(function(fid){ return expanded[fid]; })[0];
    p.anchorFamily = anchorId;
    (byFamily[anchorId] = byFamily[anchorId] || []).push(p);
  });
  Object.keys(byFamily).forEach(function(fid){
    var family = nodeById[fid];
    var kids = byFamily[fid];
    var dist = linkDistanceFor(fid);
    var angleStep = (2 * Math.PI) / kids.length;
    kids.forEach(function(p, i){
      var angle = -Math.PI / 2 + i * angleStep;
      p.x = family.x + dist * Math.cos(angle);
      p.y = family.y + dist * Math.sin(angle);
    });
  });
}

// A single bounded pass to nudge apart dots that end up literally
// overlapping (siblings on a tight ring, or two different families'
// rings happening to intersect). Capped displacement, one pass —
// this is cleanup, not a solver, and it deliberately stops rather
// than chase a perfect result.
var MAX_NUDGE = 40;
function nudgeApartDots(visiblePieces){
  for (var i = 0; i < visiblePieces.length; i++){
    for (var j = i + 1; j < visiblePieces.length; j++){
      var a = visiblePieces[i], b = visiblePieces[j];
      var dx = a.x - b.x, dy = a.y - b.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
      var minDist = a.r + b.r + 26;
      if (dist < minDist){
        var overlap = Math.min((minDist - dist) / 2, MAX_NUDGE / 2);
        var ux = dx / dist, uy = dy / dist;
        a.x += ux * overlap; a.y += uy * overlap;
        b.x -= ux * overlap; b.y -= uy * overlap;
      }
    }
    families.forEach(function(f){
      var famNode = nodeById[f.id];
      var dx = visiblePieces[i].x - famNode.x, dy = visiblePieces[i].y - famNode.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
      var minDist = visiblePieces[i].r + famNode.r + 14;
      if (dist < minDist){
        var ux = dx / dist, uy = dy / dist;
        visiblePieces[i].x = famNode.x + ux * minDist;
        visiblePieces[i].y = famNode.y + uy * minDist;
      }
    });
  }
}

// A single deterministic top-to-bottom sweep per side (left/right of
// canvas centre) so labels in a shared column don't sit on each
// other — but capped: if a piece would need to move more than
// MAX_LABEL_PUSH from where placement put it, the sweep stops and a
// little overlap is accepted rather than the piece wandering off.
var MAX_LABEL_PUSH = 75;
function settleLabels(visiblePieces){
  visiblePieces.forEach(function(n){ pieceLabelBox(n); n.baseY = n.y; });
  var familyBoxes = families.map(function(f){ return familyLabelBox(nodeById[f.id]); });
  [-1, 1].forEach(function(side){
    var group = visiblePieces.filter(function(n){ return n.labelSide === side; });
    group.sort(function(a, b){ return a.y - b.y; });
    var placed = [];
    group.forEach(function(n){
      var pBox = pieceLabelBox(n);
      var guard = 0;
      var conflict = true;
      while (conflict && guard < 15) {
        conflict = false;
        for (var f = 0; f < familyBoxes.length; f++){
          if (boxesOverlap(pBox, familyBoxes[f])) {
            var proposedY = familyBoxes[f].bottom + LABEL_HALF_H + LABEL_GAP;
            if (proposedY - n.baseY > MAX_LABEL_PUSH) break; // accept the overlap rather than push further
            n.y = proposedY;
            pBox = pieceLabelBox(n);
            conflict = true;
          }
        }
        for (var p = 0; p < placed.length; p++){
          if (boxesOverlap(pBox, placed[p])) {
            var proposedY2 = placed[p].bottom + LABEL_HALF_H + LABEL_GAP;
            if (proposedY2 - n.baseY > MAX_LABEL_PUSH) break;
            n.y = proposedY2;
            pBox = pieceLabelBox(n);
            conflict = true;
          }
        }
        guard++;
      }
      placed.push(pBox);
    });
  });
  visiblePieces.forEach(function(n){ pieceLabelBox(n); }); // finalize labelSide for rendering
}

// ---------- family repositioning: capped, one-shot, direct ----------
// Closed families always sit exactly at home. A newly-opening family
// checks against already-settled open families; if their piece
// rings would overlap, it's nudged away — but by a single computed
// vector, capped at MAX_FAMILY_DRIFT, not an iterative physics
// solve. If the cap isn't enough to fully clear the crowding, a
// little tightness is accepted rather than the family wandering
// further. Already-open families never move once settled.
var MAX_FAMILY_DRIFT = 65;
var previouslyOpenIds = {};
function repositionOpenFamilies(){
  var openIds = families.filter(function(f){ return expanded[f.id]; }).map(function(f){ return f.id; });

  families.forEach(function(f){
    var n = nodeById[f.id];
    if (!expanded[f.id]) { n.x = n.homeX; n.y = n.homeY; }
  });

  var newlyOpenIds = openIds.filter(function(id){ return !previouslyOpenIds[id]; });
  var stableIds = openIds.filter(function(id){ return previouslyOpenIds[id]; });

  newlyOpenIds.forEach(function(id){
    var n = nodeById[id];
    n.x = n.homeX; n.y = n.homeY;
    var pushX = 0, pushY = 0;
    stableIds.forEach(function(otherId){
      var o = nodeById[otherId];
      var dx = n.x - o.x, dy = n.y - o.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
      var wanted = linkDistanceFor(id) + linkDistanceFor(otherId) + 55;
      if (dist < wanted){
        var shortfall = wanted - dist;
        pushX += (dx / dist) * shortfall;
        pushY += (dy / dist) * shortfall;
      }
    });
    var mag = Math.sqrt(pushX * pushX + pushY * pushY);
    if (mag > MAX_FAMILY_DRIFT) { pushX = (pushX / mag) * MAX_FAMILY_DRIFT; pushY = (pushY / mag) * MAX_FAMILY_DRIFT; }
    n.x += pushX; n.y += pushY;
  });

  previouslyOpenIds = {};
  openIds.forEach(function(id){ previouslyOpenIds[id] = true; });
}

var svg = document.getElementById('graph');
svg.setAttribute('viewBox', '0 0 ' + VB_W + ' ' + VB_H);
var edgeLayer = document.getElementById('edges');
var nodeLayer = document.getElementById('nodes');
var NS = 'http://www.w3.org/2000/svg';
var expanded = {};
var openPieceId = null;
var isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

var piecePanel = document.getElementById('piece-panel');
var graphArrows = document.getElementById('graph-arrows');
var panelImages = document.getElementById('panel-images');
var panelContent = document.getElementById('panel-content');
var panelClose = document.getElementById('panel-close');

function closePanel(){
  openPieceId = null;
  piecePanel.classList.remove('open');
  graphArrows.classList.remove('open');
  panelImages.innerHTML = '';
  panelContent.innerHTML = '';
}
panelClose.addEventListener('click', closePanel);

function openPanel(piece){
  openPieceId = piece.id;
  piecePanel.classList.add('open');
  graphArrows.classList.add('open');

  var textHtml = '';
  if (piece.panelHtml) {
    textHtml += piece.panelHtml;
  } else {
    textHtml += '<h3>' + (piece.fullLabel || piece.label) + '</h3>';
    textHtml += '<p class="meta">' + piece.year + '</p>';
    textHtml += '<p>' + piece.forr + '</p>';
    textHtml += '<p class="meta">' + piece.where + '</p>';
    if (piece.url) {
      textHtml += '<p><a href="' + piece.url + '" target="_blank" rel="noopener">' + (piece.urlLabel || piece.url) + '</a></p>';
    }
  }
  panelContent.innerHTML = textHtml;

  if (piece.images && piece.images.length) {
    var imgHtml = '';
    piece.images.forEach(function(img){
      imgHtml += '<img src="' + img.src + '" alt="' + (img.alt || '') + '">';
    });
    panelImages.innerHTML = imgHtml;
  } else {
    panelImages.innerHTML = '';
  }

  requestAnimationFrame(function(){
    piecePanel.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  });
}

function clampX(n, v){
  return Math.max(n.r, Math.min(VB_W - n.r, v));
}
function clampY(n, v){
  return Math.max(n.r, Math.min(VB_H - n.r, v));
}

function drawEdges(){
  edgeLayer.innerHTML = '';
  var visiblePieceIds = {};
  pieces.forEach(function(p){
    if (p.links.some(function(fid){ return expanded[fid]; })) visiblePieceIds[p.id] = true;
  });
  edges.forEach(function(e){
    if (!visiblePieceIds[e.to]) return;
    var a = nodeById[e.from], b = nodeById[e.to];
    var line = document.createElementNS(NS,'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('stroke', a.color || '#000000');
    line.setAttribute('stroke-opacity', a.id === 'collabs' ? '0.6' : '0.3');
    line.setAttribute('stroke-width', '1');
    edgeLayer.appendChild(line);
  });
}

var nodeElements = {};

function positionNode(n, g, animate){
  n.x = clampX(n, n.x);
  n.y = clampY(n, n.y);
  if (!animate) g.style.transition = 'none';
  g.style.transform = 'translate(' + n.x + 'px,' + n.y + 'px)';
  if (!animate) {
    g.getBoundingClientRect();
    g.style.transition = '';
  }
}

function updatePieceLabel(n, textEl){
  var side = n.labelSide === -1 ? -1 : 1;
  if (side === 1) {
    textEl.setAttribute('text-anchor', 'start');
    textEl.setAttribute('x', n.r + 6);
  } else {
    textEl.setAttribute('text-anchor', 'end');
    textEl.setAttribute('x', -(n.r + 6));
  }
}

function createNode(n){
  var g = document.createElementNS(NS,'g');
  var isFamily = n.type === 'family';
  g.setAttribute('class', isFamily ? 'family-node' : 'piece-node');
  if (isFamily && expanded[n.id]) g.classList.add('expanded');

  var circle = document.createElementNS(NS,'circle');
  circle.setAttribute('r', n.r);
  if (isFamily) {
    circle.setAttribute('fill', n.color);
    circle.setAttribute('stroke', 'none');
    circle.setAttribute('stroke-width', '0');
  } else {
    circle.setAttribute('fill', '#ffffff');
    circle.setAttribute('stroke', '#000000');
    circle.setAttribute('stroke-width', '1.2');
  }
  g.appendChild(circle);

  if (isFamily) {
    var label = document.createElementNS(NS,'text');
    label.textContent = n.label;
    label.setAttribute('class', 'f-label');
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('y', -(n.r + 8));
    label.setAttribute('font-family', 'Courier New, Courier, monospace');
    label.setAttribute('font-size', '12');
    label.setAttribute('fill', '#000000');
    g.appendChild(label);
  } else {
    var text = document.createElementNS(NS,'text');
    text.textContent = n.fullLabel || n.label;
    text.setAttribute('class', 'p-label');
    text.setAttribute('dy', '0.35em');
    text.setAttribute('font-family', 'Helvetica Neue, Helvetica, Arial, sans-serif');
    text.setAttribute('font-size', '11');
    text.setAttribute('fill', '#000000');
    g.appendChild(text);
    updatePieceLabel(n, text);
  }

  nodeLayer.appendChild(g);
  g.style.cursor = 'pointer';
  nodeElements[n.id] = g;

  var dragging = false, offX = 0, offY = 0, moved = 0;
  function toSvgPoint(evt){
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  g.addEventListener('pointerdown', function(evt){
    if (isTouchDevice) return;
    evt.preventDefault();
    dragging = true;
    moved = 0;
    g.setPointerCapture(evt.pointerId);
    var p = toSvgPoint(evt);
    offX = n.x - p.x; offY = n.y - p.y;
    g.style.cursor = 'grabbing';
  });
  g.addEventListener('pointermove', function(evt){
    if (!dragging) return;
    var p = toSvgPoint(evt);
    var newX = clampX(n, p.x + offX);
    var newY = clampY(n, p.y + offY);
    moved += Math.abs(newX - n.x) + Math.abs(newY - n.y);
    n.x = newX; n.y = newY;
    positionNode(n, g, false);
    drawEdges();
  });
  g.addEventListener('pointerup', function(){
    dragging = false;
    g.style.cursor = 'pointer';
    if (moved < 4) {
      if (isFamily) {
        toggleFamily(n.id);
      } else {
        if (openPieceId === n.id) { closePanel(); } else { openPanel(n); }
      }
    }
  });

  return g;
}

function visiblePieceList(){
  return pieces
    .map(function(p){ return nodeById[p.id]; })
    .filter(function(n){ return n.links.some(function(fid){ return expanded[fid]; }); });
}

var MAX_OPEN_FAMILIES = 3;
var openOrder = [];

function toggleFamily(id){
  if (expanded[id]) {
    expanded[id] = false;
    openOrder = openOrder.filter(function(fid){ return fid !== id; });
  } else {
    expanded[id] = true;
    openOrder.push(id);
    while (openOrder.length > MAX_OPEN_FAMILIES) {
      var oldest = openOrder.shift();
      expanded[oldest] = false;
    }
  }
  render();
}

function render(){
  var visible = visiblePieceList();

  repositionOpenFamilies();
  placePiecesDirect(visible);
  if (visible.length) {
    nudgeApartDots(visible);
    settleLabels(visible);
  }

  var visibleIds = {};
  families.forEach(function(f){ visibleIds[f.id] = true; });
  visible.forEach(function(n){ visibleIds[n.id] = true; });

  Object.keys(nodeElements).forEach(function(id){
    if (!visibleIds[id]) {
      nodeElements[id].remove();
      delete nodeElements[id];
    }
  });

  var secondaryFamilyIds = {};
  visible.forEach(function(n){
    n.links.forEach(function(fid){
      if (!expanded[fid]) secondaryFamilyIds[fid] = true;
    });
  });

  families.forEach(function(f){
    var n = nodeById[f.id];
    var g = nodeElements[f.id];
    if (!g) { g = createNode(n); positionNode(n, g, false); }
    else { positionNode(n, g, true); }
    g.classList.toggle('expanded', !!expanded[f.id]);
    g.classList.toggle('secondary', !expanded[f.id] && !!secondaryFamilyIds[f.id]);
  });

  visible.forEach(function(n){
    var g = nodeElements[n.id];
    if (g) {
      positionNode(n, g, true);
      var labelEl = g.querySelector('.p-label');
      if (labelEl) updatePieceLabel(n, labelEl);
    } else {
      g = createNode(n);
      positionNode(n, g, false);
    }
  });

  drawEdges();
}

render();

// ---------- plain-list view: generated from the same data as the ----------
// graph above, so a new piece only ever needs adding in one place.
// Two orderings: by family (matches the graph's fixed order) and by
// year (chronological; each title gets a small dot in its family's
// colour, but the year headings themselves stay neutral).
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function pieceMetaLine(p){
  if (p.note) return p.note;
  var parts = [];
  if (p.forr) parts.push(p.forr);
  if (p.where) parts.push(p.where);
  return parts.join(' — ');
}

function pieceListItem(p, withDot){
  var dot = withDot
    ? '<span class="piece-dot" style="background-color:' + nodeById[p.links[0]].color + '"></span>'
    : '';
  var meta = pieceMetaLine(p);
  return '<li>' + dot + (p.fullLabel || p.label) +
    (meta ? '<br><span class="meta">' + meta + '</span>' : '') +
    '</li>';
}

function renderListByFamily(){
  var html = '';
  families.forEach(function(f, i){
    var members = pieces.filter(function(p){ return p.links.indexOf(f.id) !== -1; });
    if (!members.length) return;
    html += '<details' + (i === 0 ? ' open' : '') + '>' +
      '<summary style="border-left: 4px solid ' + f.color + '; padding-left: 10px;">' + cap(f.label) + '</summary>' +
      '<ul class="recent">' + members.map(function(p){ return pieceListItem(p, false); }).join('') + '</ul>' +
      '</details>';
  });
  document.getElementById('list-content').innerHTML = html;
}

function renderListByYear(){
  var byYear = {};
  var yearOrder = [];
  pieces.forEach(function(p){
    var y = p.year || 'TBA';
    if (!byYear[y]) { byYear[y] = []; yearOrder.push(y); }
    byYear[y].push(p);
  });
  yearOrder.sort(function(a, b){
    var na = parseInt(a, 10), nb = parseInt(b, 10);
    if (isNaN(na)) return 1;   // non-numeric (TBA) sinks to the end
    if (isNaN(nb)) return -1;
    return nb - na;            // most recent first
  });
  var html = '';
  yearOrder.forEach(function(y, i){
    html += '<details' + (i === 0 ? ' open' : '') + '>' +
      '<summary style="border-left: 4px solid var(--ink); opacity: 0.55; padding-left: 10px;">' + y + '</summary>' +
      '<ul class="recent">' + byYear[y].map(function(p){ return pieceListItem(p, true); }).join('') + '</ul>' +
      '</details>';
  });
  document.getElementById('list-content').innerHTML = html;
}

var showByFamilyBtn = document.getElementById('show-by-family');
var showByYearBtn = document.getElementById('show-by-year');
showByFamilyBtn.addEventListener('click', function(){
  renderListByFamily();
  showByFamilyBtn.classList.add('active');
  showByYearBtn.classList.remove('active');
});
showByYearBtn.addEventListener('click', function(){
  renderListByYear();
  showByYearBtn.classList.add('active');
  showByFamilyBtn.classList.remove('active');
});

renderListByFamily();
</script>
