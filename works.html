var nodeById = {};
families.forEach(function(f){ nodeById[f.id] = f; });
pieces.forEach(function(p){ nodeById[p.id] = p; });

// ---------- tree layout: deterministic, no physics ----------
// Each family is a row on a vertical spine. Closed rows are compact
// (just the circle). An open row grows tall enough to fit its
// pieces, each piece getting its own dedicated vertical slot — which
// is what guarantees pieces can never overlap: it's not solved for,
// it's built in by construction. Opening or closing a family only
// ever changes that family's own row height; every other row is
// completely unaffected, so nothing else on the page ever moves.
var SPINE_X = 26;
var FAMILY_R = 12;
var PIECE_R = 6;
var CLOSED_ROW_H = 46; // was 40 — a little more breathing room between family dots
var PIECE_ROW_H = 46;
var ROW_PAD = 14;
var PIECE_X = 150;
var CORNER_R = 6;
var TOP_PAD = 40; // extra room at the top for the year header row
var PHONE_TOP_PAD = 20; // phone has no in-graph year axis to reserve room for
var BOTTOM_PAD = 16;
var PIECE_FONT_SIZE = 17; // matches the intro paragraph's body copy
var DATE_FONT_SIZE = 12;
var FAMILY_LABEL_FONT_SIZE = 13;
var FAMILY_LABEL_FONT = '"Courier New", Courier, monospace';

// Ratio system: three distances that used to be separate magic
// numbers — the gap between year columns, the length of the straight
// stretch next to a family dot (where its name sits once expanded),
// and the gap between parallel dotted secondary-links — are now all
// driven off ONE unit, so the whole graph reads as consistently
// spaced. The unit itself comes from the widest family name that
// ISN'T abbreviated (winds/brass/keys/voice/strings/collabs) at the
// font it's actually drawn in, plus a little padding — abbreviated
// names (perc., elect., orch. & ens., interd.) are always shorter,
// so they fit comfortably within a unit sized for the longest one
// that stays full-length.
var UNCHANGED_FAMILY_IDS = ['winds', 'brass', 'keys', 'voice', 'strings', 'collabs'];
function measureLabelWidth(text, fontPx, fontFamily){
  var c = measureLabelWidth._canvas || (measureLabelWidth._canvas = document.createElement('canvas'));
  var ctx = c.getContext('2d');
  ctx.font = fontPx + 'px ' + fontFamily;
  return ctx.measureText(text).width;
}
var longestUnchangedWidth = Math.max.apply(null, UNCHANGED_FAMILY_IDS.map(function(id){
  var f = families.filter(function(x){ return x.id === id; })[0];
  return measureLabelWidth(f.label, FAMILY_LABEL_FONT_SIZE, FAMILY_LABEL_FONT);
}));
var UNIT_DESKTOP = Math.ceil(longestUnchangedWidth) + 16; // + padding so text never touches the bend

// Phone gets its own, tighter unit: since every family shows its
// SHORT label when open (on phone as well as desktop, per the
// always-visible-name change below), the space that actually needs
// reserving on phone is sized to the widest short label, not the
// widest full one — real measurement, just a smaller basis.
var longestShortWidth = Math.max.apply(null, families.map(function(f){
  return measureLabelWidth(f.shortLabel, FAMILY_LABEL_FONT_SIZE, FAMILY_LABEL_FONT);
}));
var UNIT_PHONE = Math.ceil(longestShortWidth) + 10;

// These three get reassigned at the top of every render() (desktop
// vs phone unit) rather than fixed once at load.
var STAGGER_X = UNIT_DESKTOP;      // per chronology rank: older pieces sit left, newer sit right
var INITIAL_LINE_LEN = UNIT_DESKTOP; // family dot -> first bend, sized to fit the family name
var LANE_STEP = UNIT_DESKTOP;      // gap between parallel dotted secondary-links

var PHONE_BREAKPOINT = 900; // matches the CSS .grow-right breakpoint
function isPhoneWidth(){ return window.innerWidth < PHONE_BREAKPOINT; }

var LABEL_LINE_HEIGHT = 20; // vertical step between wrapped label lines, phone only
function wrapLabelLines(text, maxWidth, fontPx, fontFamily){
  var words = text.split(' ');
  var lines = [];
  var current = '';
  words.forEach(function(word){
    var candidate = current ? current + ' ' + word : word;
    if (!current || measureLabelWidth(candidate, fontPx, fontFamily) <= maxWidth) {
      current = candidate;
    } else {
      lines.push(current);
      current = word;
    }
  });
  if (current) lines.push(current);
  return lines.length ? lines : [text];
}

var openPieceId = null;

// Phone's starting year: today's real year if the catalog has
// anything in it, otherwise the closest earlier year, otherwise
// whatever the earliest year in the data is.
var CURRENT_REAL_YEAR = new Date().getFullYear();
var phoneYear = CURRENT_REAL_YEAR; // reassigned right after GLOBAL_YEARS exists below

function yearValue(y){
  var n = parseInt(y, 10);
  return isNaN(n) ? Infinity : n; // TBA / unknown sinks to the newest end
}

// Column position reads as chronology across the WHOLE graph, so the
// year-to-column mapping is global — built once from the entire
// dataset.
var GLOBAL_YEARS = pieces.map(function(p){ return yearValue(p.year); })
  .filter(function(yv, i, arr){ return arr.indexOf(yv) === i; })
  .sort(function(a, b){ return a - b; });
var GLOBAL_RANK_BY_YEAR = {};
GLOBAL_YEARS.forEach(function(yv, i){ GLOBAL_RANK_BY_YEAR[yv] = i; });

(function resolvePhoneYear(){
  var finiteYears = GLOBAL_YEARS.filter(function(y){ return isFinite(y); });
  if (finiteYears.indexOf(CURRENT_REAL_YEAR) !== -1) { phoneYear = CURRENT_REAL_YEAR; return; }
  var closestBelow = finiteYears.reduce(function(best, y){
    return (y <= CURRENT_REAL_YEAR && (best === null || y > best)) ? y : best;
  }, null);
  phoneYear = closestBelow !== null ? closestBelow : (finiteYears.length ? finiteYears[0] : GLOBAL_YEARS[0]);
})();

// Desktop no longer has an expand/collapse concept — every family is
// always "open" so every name and every piece stays visible at once.
// The year axis at the top is purely a chronology label now, not a
// filter: it never changes what's shown.
var ALL_FAMILIES_OPEN = {};
families.forEach(function(f){ ALL_FAMILIES_OPEN[f.id] = true; });

function piecesFor(familyId, expandedMap){
  // A piece belongs to the first family in ITS OWN link order that's
  // currently open — stable regardless of family order, and each
  // piece only ever occupies one row, never duplicated. Sorted oldest
  // first, so chronology reads top-to-bottom (and, via the x stagger
  // below, left-to-right) within the row.
  return pieces.filter(function(p){
    return p.links[0] === familyId ? expandedMap[familyId] :
      p.links.indexOf(familyId) !== -1 && expandedMap[familyId] &&
      p.links.filter(function(fid){ return expandedMap[fid]; })[0] === familyId;
  }).sort(function(a, b){ return yearValue(a.year) - yearValue(b.year); });
}

// ---------- phone year-switcher mode ----------
// On phone the person steps through one year at a time (arrows either
// side of a centered year label). Every family that has at least one
// piece that year is shown "open" with its pieces listed; families
// that are only a secondary link for that year's pieces show as a
// plain closed dot (an anchor for the dotted connecting line) instead
// of an empty open row. Families with nothing at all that year are
// skipped entirely, which is what keeps the phone graph short.
function piecesForYear(yv){
  return pieces.filter(function(p){ return yearValue(p.year) === yv; });
}
function relevantFamiliesForYear(yv){
  return families.filter(function(f){
    return piecesForYear(yv).some(function(p){ return p.links.indexOf(f.id) !== -1; });
  });
}
function primaryFamilyMapForYear(yv){
  var map = {};
  piecesForYear(yv).forEach(function(p){ map[p.links[0]] = true; });
  return map;
}

// currentState() is read fresh at the top of every render(). Desktop
// always shows the full catalog (every family, every piece, every
// year, positioned along the chronology); phone still narrows to one
// year at a time so the graph fits a small screen.
function currentState(){
  if (isPhoneWidth()) {
    return {
      phone: true,
      familiesList: relevantFamiliesForYear(phoneYear),
      expandedMap: primaryFamilyMapForYear(phoneYear),
      yearFilterVal: phoneYear
    };
  }
  return {
    phone: false,
    familiesList: families,
    expandedMap: ALL_FAMILIES_OPEN,
    yearFilterVal: null
  };
}


function computeLayout(state){
  var phone = state.phone;
  var unit = phone ? UNIT_PHONE : UNIT_DESKTOP;
  STAGGER_X = unit;
  INITIAL_LINE_LEN = unit;
  LANE_STEP = unit;

  // On phone, every visible piece shares one fixed column no matter
  // which year is picked — so switching years doesn't shift anything
  // horizontally, and the graph never needs more room than that
  // single column already fits in. Desktop keeps true per-year
  // columns (with its own optional year-axis filter, unaffected).
  var lockToOneColumn = state.yearFilterVal !== null && phone;
  var containerW = contentWidth();
  var topPad = phone ? PHONE_TOP_PAD : TOP_PAD;

  var y = topPad;
  var rows = [];
  var secondaryFamilyIds = {}; // closed families a visible piece also links to

  state.familiesList.forEach(function(f){
    var isOpen = !!state.expandedMap[f.id];
    var kids = isOpen ? piecesFor(f.id, state.expandedMap) : [];
    if (state.yearFilterVal !== null) kids = kids.filter(function(p){ return yearValue(p.year) === state.yearFilterVal; });
    kids.forEach(function(p){
      p.links.forEach(function(fid){ if (fid !== f.id && !state.expandedMap[fid]) secondaryFamilyIds[fid] = true; });

      // x doesn't depend on row position, so it's safe to assign here,
      // before row heights (which now depend on wrapped label height,
      // which depends on x) are worked out below.
      p.treeX = lockToOneColumn ? PIECE_X : PIECE_X + GLOBAL_RANK_BY_YEAR[yearValue(p.year)] * STAGGER_X;
      p.homeFamily = f.id;

      // Phone: wrap the label into as many lines as it needs to fit
      // the real remaining width, instead of letting it push the
      // graph wider than the screen. Desktop is unchanged — single line.
      if (phone) {
        var availW = Math.max(60, containerW - (p.treeX + PIECE_R + 10) - 16);
        p.labelLines = wrapLabelLines(p.fullLabel || p.label, availW, PIECE_FONT_SIZE, '"Helvetica Neue", Helvetica, Arial, sans-serif');
      } else {
        p.labelLines = [p.fullLabel || p.label];
      }
      p.slotH = PIECE_ROW_H + (p.labelLines.length - 1) * LABEL_LINE_HEIGHT;
    });
    var kidsH = kids.reduce(function(sum, p){ return sum + p.slotH; }, 0);
    var rowH = isOpen ? Math.max(CLOSED_ROW_H, ROW_PAD * 2 + kidsH) : CLOSED_ROW_H;
    rows.push({ family: f, top: y, rowH: rowH, centerY: y + rowH / 2, kids: kids, isOpen: isOpen });
    y += rowH;
  });

  // The in-graph clickable year axis is a desktop-only affordance —
  // on phone the year-switcher above the graph replaces it, and
  // skipping it here is also what lets the phone graph start higher
  // up (see PHONE_TOP_PAD) instead of reserving header space for a
  // row that's never drawn.
  var axisYears = phone ? [] : GLOBAL_YEARS.map(function(yv){
    return { yv: yv, label: (yv === Infinity ? 'TBA' : String(yv)), x: PIECE_X + GLOBAL_RANK_BY_YEAR[yv] * STAGGER_X };
  });

  rows.forEach(function(row){
    row.secondary = !row.isOpen && !!secondaryFamilyIds[row.family.id];
    if (row.kids.length === 1) {
      row.kids[0].treeY = row.centerY;
      return;
    }
    // Slots are no longer uniform (a wrapped label needs a taller
    // slot than a single-line one) — stack cumulatively by each
    // piece's own slotH, spreading any leftover row space evenly
    // between them. When every slotH is equal (always true on
    // desktop) this produces the exact same positions as simple
    // even division did before.
    var innerTop = row.top + ROW_PAD;
    var innerH = row.rowH - ROW_PAD * 2;
    var totalKidsH = row.kids.reduce(function(s, p){ return s + p.slotH; }, 0);
    var gap = (innerH - totalKidsH) / row.kids.length;
    var cursor = innerTop;
    row.kids.forEach(function(p){
      p.treeY = cursor + gap / 2 + p.slotH / 2;
      cursor += gap + p.slotH;
    });
  });

  return { rows: rows, totalHeight: y + BOTTOM_PAD, axisYears: axisYears };
}

function connectorPath(familyY, pieceY, pieceX){
  var x1 = SPINE_X + FAMILY_R, x2 = pieceX - PIECE_R;
  if (Math.abs(pieceY - familyY) < 0.5) return 'M' + x1 + ',' + familyY + ' L' + x2 + ',' + pieceY;
  var dir = pieceY > familyY ? 1 : -1;
  var midX = x1 + INITIAL_LINE_LEN;
  var r = CORNER_R;
  return 'M' + x1 + ',' + familyY +
    ' L' + (midX - r) + ',' + familyY +
    ' Q' + midX + ',' + familyY + ' ' + midX + ',' + (familyY + r * dir) +
    ' L' + midX + ',' + (pieceY - r * dir) +
    ' Q' + midX + ',' + pieceY + ' ' + (midX + r) + ',' + pieceY +
    ' L' + x2 + ',' + pieceY;
}

// Secondary (multi-family) links route AWAY from the crowded middle
// of the diagram instead of through it: out to the right of the
// piece's own title (as far as the canvas allows, so parallel links
// don't cross each other or other pieces' text), down/up to clear
// the family's row, back in toward the spine, then a short straight
// drop into the family dot from directly above — so the link always
// reads as "entering the family from the top", never poking into
// its side.
function secondaryLinkPath(familyY, pieceY, pieceX, laneX){
  var famX = SPINE_X;
  var topY = familyY - FAMILY_R - 10; // approach point, just above the family dot
  var famEntryY = familyY - FAMILY_R; // top edge of the family dot itself
  var r = CORNER_R;
  var dirDown = topY >= pieceY ? 1 : -1; // whether the out-and-down leg travels down or up

  return 'M' + pieceX + ',' + pieceY +
    ' L' + (laneX - r) + ',' + pieceY +
    ' Q' + laneX + ',' + pieceY + ' ' + laneX + ',' + (pieceY + r * dirDown) +
    ' L' + laneX + ',' + (topY - r * dirDown) +
    ' Q' + laneX + ',' + topY + ' ' + (laneX - r) + ',' + topY +
    ' L' + (famX + r) + ',' + topY +
    ' Q' + famX + ',' + topY + ' ' + famX + ',' + (topY + r) +
    ' L' + famX + ',' + famEntryY;
}

function shortFamilyLabel(family){
  return family.shortLabel;
}

var svg = document.getElementById('tree');
var treeContent = document.getElementById('tree-content');
var treeWrapEl = document.getElementById('tree-wrap');
var NS = 'http://www.w3.org/2000/svg';

// The viewBox width is set to the wrapper's actual rendered pixel
// width, so 1 svg unit always equals 1 real px — dots, fonts and
// spacing stay the exact size specified above no matter how wide
// the page is, instead of being stretched to fill it.
function contentWidth(){
  return treeWrapEl.clientWidth || 640;
}

var piecePanel = document.getElementById('piece-panel');
var panelImages = document.getElementById('panel-images');
var panelContent = document.getElementById('panel-content');
var panelClose = document.getElementById('panel-close');

function closePanel(){
  openPieceId = null;
  piecePanel.classList.remove('open');
  panelImages.innerHTML = '';
  panelContent.innerHTML = '';
  render();
}
panelClose.addEventListener('click', closePanel);

function openPanel(piece){
  openPieceId = piece.id;
  piecePanel.classList.add('open');

  var textHtml = '';
  if (piece.panelHtml) {
    textHtml += piece.panelHtml;
  } else {
    textHtml += '<h3>' + (piece.fullLabel || piece.label) + '</h3>';
    textHtml += '<p class="meta">' + piece.year + '</p>';
    textHtml += '<p>' + piece.forr + '</p>';
    if (piece.performers && piece.performers.length) {
      textHtml += '<p class="meta">Performers</p>';
      textHtml += '<p>' + piece.performers.map(function(person){
        return person.url
          ? '<a href="' + person.url + '" target="_blank" rel="noopener">' + person.name + '</a>'
          : person.name;
      }).join('<br>') + '</p>';
    }
    textHtml += '<p class="meta">' + piece.where + '</p>';
  }
  panelContent.innerHTML = textHtml;

  if (piece.images && piece.images.length) {
    var imgHtml = '';
    piece.images.forEach(function(img){
      imgHtml += '<img src="' + img.src + '" alt="' + (img.alt || '') + '">';
    });
    panelImages.innerHTML = imgHtml;
  } else {
    panelImages.innerHTML = '';
  }

  render();
  requestAnimationFrame(function(){
    piecePanel.scrollIntoView({behavior: 'smooth', block: 'start'});
  });
}

function render(){
  var state = currentState();
  var layout = computeLayout(state);
  treeContent.innerHTML = '';

  var containerWidth = contentWidth();
  var vbw, needsScroll;

  if (isPhoneWidth()) {
    // Phone: labels now wrap onto extra lines instead of pushing the
    // graph wider (see computeLayout's slotH), and columns use the
    // tighter UNIT_PHONE spacing — so the graph should always fit
    // within the container without needing to scroll at all.
    vbw = containerWidth;
    needsScroll = false;
  } else {
    // Desktop: unchanged — grow past the container and scroll if
    // enough year columns are open to push pieces past the edge.
    var allKids = [];
    layout.rows.forEach(function(row){ row.kids.forEach(function(p){ allKids.push(p); }); });
    var neededWidth = allKids.reduce(function(max, p){
      var labelW = measureLabelWidth(p.fullLabel || p.label, PIECE_FONT_SIZE, '"Helvetica Neue", Helvetica, Arial, sans-serif');
      var rightEdge = p.treeX + PIECE_R + 10 + labelW + 24; // label start offset + measured text + right margin
      return Math.max(max, rightEdge);
    }, 0);
    vbw = Math.max(containerWidth, neededWidth);
    needsScroll = vbw > containerWidth;
  }

  svg.style.width = needsScroll ? vbw + 'px' : '100%';
  treeWrapEl.style.overflowX = needsScroll ? 'auto' : 'visible';

  svg.setAttribute('viewBox', '0 0 ' + vbw + ' ' + layout.totalHeight);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.style.height = layout.totalHeight + 'px';

  var familyRowById = {};
  layout.rows.forEach(function(row){ familyRowById[row.family.id] = row; });
  var secondaryLinkPaths = []; // drawn after all rows exist, so every family's position is known

  layout.rows.forEach(function(row){
    var f = row.family;
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'family-row' + (row.isOpen ? ' expanded' : '') + (row.secondary ? ' secondary' : ''));

    var circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('cx', SPINE_X); circle.setAttribute('cy', row.centerY); circle.setAttribute('r', FAMILY_R);
    circle.setAttribute('fill', f.color);
    g.appendChild(circle);

    var label = document.createElementNS(NS, 'text');
    label.textContent = row.isOpen ? shortFamilyLabel(f) : f.label;
    label.setAttribute('class', 'f-label');
    label.setAttribute('x', SPINE_X - FAMILY_R);
    label.setAttribute('y', row.centerY - FAMILY_R - 7);
    label.setAttribute('text-anchor', 'start');
    label.setAttribute('font-family', 'Courier New, Courier, monospace');
    label.setAttribute('font-size', '13');
    label.setAttribute('fill', '#000000');
    if (row.isOpen) {
      var labelTitle = document.createElementNS(NS, 'title');
      labelTitle.textContent = f.label;
      label.appendChild(labelTitle);
    }
    g.appendChild(label);

    row.kids.forEach(function(p){
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', connectorPath(row.centerY, p.treeY, p.treeX));
      path.setAttribute('class', 'connector');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', '#000000');
      path.setAttribute('stroke-width', '1');
      path.setAttribute('opacity', '0.8');
      treeContent.appendChild(path);

      var pg = document.createElementNS(NS, 'g');
      pg.setAttribute('class', 'piece-node');
      pg.style.cursor = 'pointer';
      treeContent.appendChild(pg); // attach immediately: getBBox() below needs pg to be live in the document

      var pc = document.createElementNS(NS, 'circle');
      pc.setAttribute('cx', p.treeX); pc.setAttribute('cy', p.treeY); pc.setAttribute('r', PIECE_R);
      pc.setAttribute('fill', '#ffffff');
      pc.setAttribute('stroke', '#000000');
      pc.setAttribute('stroke-width', '0.8');
      pg.appendChild(pc);

      var pl = document.createElementNS(NS, 'text');
      pl.setAttribute('class', 'p-label');
      pl.setAttribute('x', p.treeX + PIECE_R + 10);
      pl.setAttribute('y', p.treeY);
      pl.setAttribute('dominant-baseline', 'central');
      pl.setAttribute('font-family', 'Helvetica Neue, Helvetica, Arial, sans-serif');
      pl.setAttribute('font-size', PIECE_FONT_SIZE);
      pl.setAttribute('fill', '#2b2b2b');
      var labelLines = p.labelLines || [p.fullLabel || p.label];
      labelLines.forEach(function(line, i){
        var tspan = document.createElementNS(NS, 'tspan');
        tspan.textContent = line;
        tspan.setAttribute('x', p.treeX + PIECE_R + 10);
        if (i > 0) tspan.setAttribute('dy', LABEL_LINE_HEIGHT);
        pl.appendChild(tspan);
      });
      pg.appendChild(pl);
      var labelEndX = pl.getBBox().x + pl.getBBox().width;

      var pd = document.createElementNS(NS, 'text');
      pd.textContent = p.year;
      pd.setAttribute('class', 'p-date');
      pd.setAttribute('x', p.treeX + PIECE_R + 10);
      pd.setAttribute('y', p.treeY + 16 + (labelLines.length - 1) * LABEL_LINE_HEIGHT);
      pd.setAttribute('dominant-baseline', 'central');
      pd.setAttribute('font-family', 'Courier New, Courier, monospace');
      pd.setAttribute('font-size', DATE_FONT_SIZE);
      pd.setAttribute('fill', '#6b6b6b');
      pg.appendChild(pd);

      // a piece that belongs to more than one family gets a dotted
      // black line to each additional family instead of a badge —
      // queued here, drawn last, once every family's row position
      // (open or closed) is known. It starts right at the end of the
      // piece's own title, not the dot.
      var otherLinks = p.links.filter(function(fid){ return fid !== p.homeFamily; });
      otherLinks.forEach(function(fid){
        var targetRow = familyRowById[fid];
        if (!targetRow) return;
        secondaryLinkPaths.push({ familyY: targetRow.centerY, pieceY: p.treeY, labelEndX: labelEndX, pieceId: p.id });
      });

      // the open piece gets a thin black box around its title + date
      // only, the same treatment the active nav link gets — the dot
      // stays outside it
      if (p.id === openPieceId) {
        var plBox = pl.getBBox(), pdBox = pd.getBBox();
        var minX = Math.min(plBox.x, pdBox.x);
        var minY = Math.min(plBox.y, pdBox.y);
        var maxX = Math.max(plBox.x + plBox.width, pdBox.x + pdBox.width);
        var maxY = Math.max(plBox.y + plBox.height, pdBox.y + pdBox.height);
        var padX = 6, padY = 4;
        var box = document.createElementNS(NS, 'rect');
        box.setAttribute('x', minX - padX);
        box.setAttribute('y', minY - padY);
        box.setAttribute('width', (maxX - minX) + padX * 2);
        box.setAttribute('height', (maxY - minY) + padY * 2);
        box.setAttribute('fill', 'none');
        box.setAttribute('stroke', '#000000');
        box.setAttribute('stroke-width', '1');
        pg.insertBefore(box, pg.firstChild);
      }

      pg.addEventListener('click', function(evt){
        evt.stopPropagation();
        openPanel(p);
      });
      pg.addEventListener('mouseenter', function(){
        treeContent.querySelectorAll('[data-piece-id="' + p.id + '"]').forEach(function(el){ el.classList.add('active'); });
      });
      pg.addEventListener('mouseleave', function(){
        treeContent.querySelectorAll('[data-piece-id="' + p.id + '"]').forEach(function(el){ el.classList.remove('active'); });
      });
    });

    treeContent.appendChild(g);
  });

  // Year axis: one static label per column, sitting in the top margin
  // — purely a chronology reminder now, not a filter. Nothing to
  // click; the columns it labels are simply where pieces from that
  // year already sit.
  var AXIS_Y = TOP_PAD - 22;
  layout.axisYears.forEach(function(ay){
    var at = document.createElementNS(NS, 'text');
    at.textContent = ay.label;
    at.setAttribute('class', 'year-axis-label');
    at.setAttribute('x', ay.x);
    at.setAttribute('y', AXIS_Y);
    at.setAttribute('text-anchor', 'middle');
    at.setAttribute('dominant-baseline', 'central');
    at.setAttribute('font-family', FAMILY_LABEL_FONT);
    at.setAttribute('font-size', FAMILY_LABEL_FONT_SIZE);
    treeContent.appendChild(at);
  });

  // Give each secondary link its own lane when its Y-range overlaps
  // another's, so simultaneous links stay visually distinguishable
  // instead of collapsing onto one shared trunk. Links that don't
  // overlap in Y can safely reuse the same lane.
  var RIGHT_MARGIN = 24; // keeps the outermost lane clear of the canvas edge
  var sortedLinks = secondaryLinkPaths.slice().sort(function(a, b){
    return Math.min(a.pieceY, a.familyY) - Math.min(b.pieceY, b.familyY);
  });
  var laneEnds = [];
  sortedLinks.forEach(function(link){
    var top = Math.min(link.pieceY, link.familyY);
    var bottom = Math.max(link.pieceY, link.familyY);
    var lane = laneEnds.findIndex(function(end){ return end < top - 6; });
    if (lane === -1) lane = laneEnds.length;
    laneEnds[lane] = bottom;
    link.lane = lane;
  });

  secondaryLinkPaths.forEach(function(link){
    var path = document.createElementNS(NS, 'path');
    var anchorX = link.labelEndX + 4; // small gap after the title text
    var laneX = vbw - RIGHT_MARGIN - link.lane * LANE_STEP; // lane 0 = furthest right / most "out"
    path.setAttribute('d', secondaryLinkPath(link.familyY, link.pieceY, anchorX, laneX));
    path.setAttribute('class', 'secondary-link');
    path.setAttribute('data-piece-id', link.pieceId);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#000000');
    path.setAttribute('stroke-width', '1.4');
    path.setAttribute('stroke-dasharray', '0.1,6');
    path.setAttribute('stroke-linecap', 'round');
    treeContent.insertBefore(path, treeContent.firstChild);
  });
}

var yearPrevBtn = document.getElementById('year-prev');
var yearNextBtn = document.getElementById('year-next');
var yearSwitcherLabel = document.getElementById('year-switcher-label');

function updateYearSwitcher(){
  yearSwitcherLabel.textContent = phoneYear === Infinity ? 'TBA' : String(phoneYear);
  var idx = GLOBAL_YEARS.indexOf(phoneYear);
  yearPrevBtn.disabled = idx <= 0;
  yearNextBtn.disabled = idx >= GLOBAL_YEARS.length - 1;
}
yearPrevBtn.addEventListener('click', function(){
  var idx = GLOBAL_YEARS.indexOf(phoneYear);
  if (idx <= 0) return;
  phoneYear = GLOBAL_YEARS[idx - 1];
  updateYearSwitcher();
  render();
});
yearNextBtn.addEventListener('click', function(){
  var idx = GLOBAL_YEARS.indexOf(phoneYear);
  if (idx === -1 || idx >= GLOBAL_YEARS.length - 1) return;
  phoneYear = GLOBAL_YEARS[idx + 1];
  updateYearSwitcher();
  render();
});
updateYearSwitcher();

render();
var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});

// ---------- catalogue view: generated from the same data as the ----------
// chronologic view above, so a new piece only ever needs adding in one
// place. Grouped by family, in the same fixed order as the graph, and
// each family header uses the same visual language — a colored dot
// plus the plain family name — instead of a boxed, bordered summary.
function pieceMetaLine(p){
  if (p.note) return p.note;
  var parts = [];
  if (p.forr) parts.push(p.forr);
  if (p.where) parts.push(p.where);
  return parts.join(' — ');
}

function pieceListItem(p, withDot){
  var dot = withDot
    ? '<span class="piece-dot" style="background-color:' + nodeById[p.links[0]].color + '"></span>'
    : '';
  var meta = pieceMetaLine(p);
  return '<li class="li-piece" data-piece-id="' + p.id + '" tabindex="0" role="button">' + dot + (p.fullLabel || p.label) +
    (meta ? '<br><span class="meta">' + meta + '</span>' : '') +
    '</li>';
}

function renderListByFamily(){
  var html = '';
  families.forEach(function(f){
    var members = pieces.filter(function(p){ return p.links.indexOf(f.id) !== -1; });
    if (!members.length) return;
    html += '<details open>' +
      '<summary><span class="family-dot" style="background-color:' + f.color + '"></span>' + f.label + '</summary>' +
      '<ul class="recent">' + members.map(function(p){ return pieceListItem(p, false); }).join('') + '</ul>' +
      '</details>';
  });
  document.getElementById('list-content').innerHTML = html;
}

// Delegated once on the container (not re-attached per render, since
// #list-content itself is never replaced — only its innerHTML is)
var listContentEl = document.getElementById('list-content');
listContentEl.addEventListener('click', function(e){
  var li = e.target.closest('.li-piece');
  if (!li) return;
  var piece = nodeById[li.getAttribute('data-piece-id')];
  if (piece) openPanel(piece);
});
listContentEl.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var li = e.target.closest('.li-piece');
  if (!li) return;
  e.preventDefault();
  var piece = nodeById[li.getAttribute('data-piece-id')];
  if (piece) openPanel(piece);
});

renderListByFamily();
</script>
