// ---------- sizing ----------
// VB_W/VB_H are the default canvas size — what's shown when little
// or nothing is open. The canvas itself grows to fit whatever's
// actually visible (see fitViewBox below), the same way a canvas
// app doesn't crop content that doesn't fit; SAFE_MARGIN is only a
// generous backstop against genuine runaway, not a real boundary.
var VB_W = 680, VB_H = 600;
var CENTER_X = VB_W / 2, CENTER_Y = VB_H / 2;
var SAFE_MARGIN = 3000;
var FAMILY_R = 18;
var PIECE_R = 5; // small dot; the label sits beside it, not inside it

// ---------- family positions: a home ring position, but families ----------
// can now drift a little from it when several crowded families are
// open together — see repositionOpenFamilies below. A closed family
// always snaps back to its home spot.
var FAMILY_RING = 190;
families.forEach(function(f, i){
  var angle = (i / families.length) * 2 * Math.PI - Math.PI / 2;
  f.x = CENTER_X + FAMILY_RING * Math.cos(angle);
  f.y = CENTER_Y + FAMILY_RING * Math.sin(angle);
  f.homeX = f.x; f.homeY = f.y;
});

var nodeById = {};
families.forEach(function(f){ nodeById[f.id] = Object.assign({type:'family', r: FAMILY_R}, f); });

var edges = [];
pieces.forEach(function(p){ p.links.forEach(function(fid){ edges.push({from:fid, to:p.id}); }); });

// How many pieces are attached to each family — used to widen that
// family's spread as its catalog grows, so density stays roughly
// constant instead of pieces cramming closer together every year.
var pieceCountByFamily = {};
pieces.forEach(function(p){
  p.links.forEach(function(fid){
    pieceCountByFamily[fid] = (pieceCountByFamily[fid] || 0) + 1;
  });
});
var BASE_LINK_DISTANCE = 60;
function linkDistanceFor(familyId){
  var count = pieceCountByFamily[familyId] || 1;
  return BASE_LINK_DISTANCE + 16 * Math.sqrt(count);
}

pieces.forEach(function(p, i){
  var anchor = nodeById[p.links[0]];
  var angle = (i * 2.399963) % (2 * Math.PI); // golden-angle spread, avoids clumping
  var dist = linkDistanceFor(p.links[0]);
  p.x = anchor.x + dist * 0.4 * Math.cos(angle);
  p.y = anchor.y + dist * 0.4 * Math.sin(angle);
  p.everPositioned = false;
});
pieces.forEach(function(p){ nodeById[p.id] = Object.assign({type:'piece', r: PIECE_R}, p); });
var pieceNodes = pieces.map(function(p){ return nodeById[p.id]; });

// ---------- live force settle for pieces ----------
// Runs every time a family opens or closes (not continuously). Only
// the currently visible pieces take part, repelling each other and
// the fixed family dots, springing toward whichever family(ies)
// they belong to. Warm-started from wherever pieces already are, so
// the graph glides into its new shape instead of jumping.
var CHARGE = 900;
var CHARGE_MIN_DIST = 26;
var MAX_SPEED = 14;
var TICKS = 140;

function settlePieces(visiblePieces){
  visiblePieces.forEach(function(n){ n.vx = 0; n.vy = 0; });
  for (var t = 0; t < TICKS; t++){
    var alpha = Math.max(1 - t / TICKS, 0.02);
    // repulsion: visible pieces repel each other and every family
    for (var i = 0; i < visiblePieces.length; i++){
      var a = visiblePieces[i];
      for (var j = 0; j < allRepellers.length; j++){
        var b = allRepellers[j];
        if (a === b) continue;
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var ux = dx / dist, uy = dy / dist;
        var softened = Math.max(dist, CHARGE_MIN_DIST);
        var force = (CHARGE * alpha) / (softened * softened);
        a.vx += ux * force; a.vy += uy * force;
      }
    }
    // springs: pull each visible piece toward every family it links to
    visiblePieces.forEach(function(p){
      p.links.forEach(function(fid){
        var family = nodeById[fid];
        var target = linkDistanceFor(fid);
        var dx = family.x - p.x, dy = family.y - p.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var diff = (dist - target) * alpha * 0.22;
        var ux = dx / dist, uy = dy / dist;
        p.vx += ux * diff; p.vy += uy * diff;
      });
    });
    visiblePieces.forEach(function(n){
      n.vx *= 0.72; n.vy *= 0.72;
      var speed = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
      if (speed > MAX_SPEED) {
        n.vx = (n.vx / speed) * MAX_SPEED;
        n.vy = (n.vy / speed) * MAX_SPEED;
      }
      n.x += n.vx; n.y += n.vy;
    });
  }
  // hard collision cleanup so dots never overlap
  for (var pass = 0; pass < 8; pass++){
    for (var i = 0; i < visiblePieces.length; i++){
      for (var j = i + 1; j < visiblePieces.length; j++){
        var a = visiblePieces[i], b = visiblePieces[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var minDist = a.r + b.r + 30; // extra room for the label text
        if (dist < minDist){
          var overlap = (minDist - dist) / 2;
          var ux = dx / dist, uy = dy / dist;
          a.x += ux * overlap; a.y += uy * overlap;
          b.x -= ux * overlap; b.y -= uy * overlap;
        }
      }
      families.forEach(function(f){
        var famNode = nodeById[f.id];
        var dx = visiblePieces[i].x - famNode.x, dy = visiblePieces[i].y - famNode.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var minDist = visiblePieces[i].r + famNode.r + 16;
        if (dist < minDist){
          var ux = dx / dist, uy = dy / dist;
          visiblePieces[i].x = famNode.x + ux * minDist;
          visiblePieces[i].y = famNode.y + uy * minDist;
        }
      });
    }
  }
  // Post-physics: converge every layout constraint together in a
  // loop, instead of a fixed one-shot sequence. A fixed sequence is
  // how a piece ends up sitting on top of an unrelated family — each
  // fix below only checks its own concern, so running them once in
  // order lets a later fix quietly re-break an earlier one. Looping
  // them together and re-checking each time is what actually
  // converges on a state where nothing overlaps.
  for (var round = 0; round < 20; round++){
    resolveLabelOverlaps(visiblePieces);
    var a1 = avoidFamilyDots(visiblePieces);
    var a2 = enforceFamilyLeash(visiblePieces);
    var a3 = spreadFamilyAngles(visiblePieces);
    if (!a1 && !a2 && !a3) break;
  }
  resolveLabelOverlaps(visiblePieces); // text separation gets the final word
  for (var finalRound = 0; finalRound < 4; finalRound++){
    var f1 = avoidFamilyDots(visiblePieces);
    var f2 = enforceFamilyLeash(visiblePieces);
    if (!f1 && !f2) break;
  }
  lightCollisionCleanup(visiblePieces);
}

// A piece's dot must never land on ANY family's circle — not just
// the families it's linked to. Nothing else in this file checks
// that after the very first placement, which is how a piece could
// end up sitting on top of a family it has nothing to do with.
function avoidFamilyDots(visiblePieces){
  var moved = false;
  visiblePieces.forEach(function(n){
    families.forEach(function(f){
      var famNode = nodeById[f.id];
      var dx = n.x - famNode.x, dy = n.y - famNode.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
      var minDist = n.r + famNode.r + 16;
      if (dist < minDist){
        var ux = dx / dist, uy = dy / dist;
        n.x = famNode.x + ux * minDist;
        n.y = famNode.y + uy * minDist;
        moved = true;
      }
    });
  });
  return moved;
}

function lightCollisionCleanup(visiblePieces){
  for (var pass = 0; pass < 6; pass++){
    for (var i = 0; i < visiblePieces.length; i++){
      for (var j = i + 1; j < visiblePieces.length; j++){
        var a = visiblePieces[i], b = visiblePieces[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var minDist = a.r + b.r + 30;
        if (dist < minDist){
          var overlap = (minDist - dist) / 2;
          var ux = dx / dist, uy = dy / dist;
          a.x += ux * overlap; a.y += uy * overlap;
          b.x -= ux * overlap; b.y -= uy * overlap;
        }
      }
    }
  }
  visiblePieces.forEach(function(n){ pieceLabelBox(n); });
}

// Fixing label overlap (above) only ever moves pieces vertically —
// nothing there ever spreads them around their family horizontally.
// Left alone, several pieces from the same family can end up nearly
// stacked in a column below it, so their connecting lines fan out
// at almost the same angle and overlap each other for most of their
// length. This spreads siblings apart in angle-from-family, holding
// each piece's y fixed (the thing that guarantees no label overlap)
// and solving only for the x that gives it a wider angle.
var MIN_FAMILY_ANGLE = 9 * Math.PI / 180;
function spreadFamilyAngles(visiblePieces){
  var moved = false;
  families.forEach(function(f){
    var fx = f.x, fy = f.y;
    var children = visiblePieces.filter(function(p){ return p.links.indexOf(f.id) !== -1; });
    if (children.length < 2) return;
    var entries = children.map(function(p){
      return { p: p, angle: Math.atan2(p.y - fy, p.x - fx), dy: p.y - fy };
    });
    entries.sort(function(a, b){ return a.angle - b.angle; });
    for (var i = 1; i < entries.length; i++){
      var prev = entries[i - 1], cur = entries[i];
      if (cur.angle - prev.angle >= MIN_FAMILY_ANGLE) continue;
      var newAngle = prev.angle + MIN_FAMILY_ANGLE;
      // Solve for x that gives this angle at the SAME y (dy fixed) —
      // that's what keeps the label-stacking result intact.
      if (Math.abs(Math.sin(newAngle)) < 0.05) continue; // near-horizontal: skip, too unstable to solve for
      var r = cur.dy / Math.sin(newAngle);
      if (!isFinite(r) || Math.abs(r) > linkDistanceFor(f.id) * 4) continue; // guard against blow-up
      cur.p.x = fx + r * Math.cos(newAngle);
      cur.angle = newAngle;
      moved = true;
    }
  });
  return moved;
}

// The label-stacking pass above only knows about avoiding overlap —
// it can end up pushing a piece a long way down the page to dodge a
// crowd, with nothing pulling it back toward its own family. Left
// alone that's how a piece ends up looking like it belongs to a
// completely different family than the one its line actually goes
// to. This is the fix: after stacking, anything that's drifted past
// a generous leash gets pulled back in along the line to its
// nearest linked family, then one more light pass mops up any
// overlap that correction reintroduces.
function enforceFamilyLeash(visiblePieces){
  var moved = false;
  visiblePieces.forEach(function(n){
    var nearest = null, nearestDist = Infinity;
    n.links.forEach(function(fid){
      var f = nodeById[fid];
      var d = Math.sqrt((n.x - f.x) * (n.x - f.x) + (n.y - f.y) * (n.y - f.y));
      if (d < nearestDist) { nearestDist = d; nearest = f; }
    });
    if (!nearest) return;
    var leash = linkDistanceFor(nearest.id) * 1.9 + 50;
    if (nearestDist > leash) {
      var ux = (n.x - nearest.x) / nearestDist, uy = (n.y - nearest.y) / nearestDist;
      n.x = nearest.x + ux * leash;
      n.y = nearest.y + uy * leash;
      moved = true;
    }
  });
  return moved;
}

// Word count matters here, not the dots: lines are allowed to cross,
// but no piece of text may ever sit on top of another. Labels point
// outward — left if the piece sits left of centre, right if it sits
// right. Within each side, labels are sorted top-to-bottom and
// stacked with a guaranteed minimum gap (the same technique chart
// libraries use for leader-line labels) — deterministic, so unlike
// a pairwise push simulation it can't get stuck oscillating between
// three labels that all overlap each other.
function approxLabelWidth(str){
  return Math.max(24, str.length * 6.4 + 6);
}
var LABEL_HALF_H = 9;
var LABEL_GAP = 5;

function pieceLabelBox(n){
  var w = approxLabelWidth(n.fullLabel || n.label);
  n.labelSide = n.x >= CENTER_X ? 1 : -1;
  var left, right;
  if (n.labelSide === 1) { left = n.x - n.r; right = n.x + n.r + 8 + w; }
  else { left = n.x - n.r - 8 - w; right = n.x + n.r; }
  return { left: left, right: right, top: n.y - LABEL_HALF_H, bottom: n.y + LABEL_HALF_H };
}

function familyLabelBox(f){
  var w = approxLabelWidth(f.label);
  return {
    left: f.x - Math.max(f.r, w / 2) - 4,
    right: f.x + Math.max(f.r, w / 2) + 4,
    top: f.y - f.r - 24,
    bottom: f.y + f.r
  };
}

function boxesOverlap(a, b){
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}

function stackBySide(visiblePieces){
  var familyBoxes = families.map(function(f){ return familyLabelBox(nodeById[f.id]); });
  [-1, 1].forEach(function(side){
    var group = visiblePieces.filter(function(n){ return n.labelSide === side; });
    group.sort(function(a, b){ return a.y - b.y; });
    var placed = []; // real boxes of pieces already placed on this side
    group.forEach(function(n){
      var pBox = pieceLabelBox(n);
      var guard = 0;
      var conflict = true;
      // Walk down past anything already there — family box or an
      // earlier piece — until clear. Only ever moves forward (y
      // increases), so this always terminates and, because every
      // earlier item on this side is already final, never needs to
      // be revisited once placed.
      while (conflict && guard < 40) {
        conflict = false;
        for (var f = 0; f < familyBoxes.length; f++){
          if (boxesOverlap(pBox, familyBoxes[f])) {
            n.y = familyBoxes[f].bottom + LABEL_HALF_H + LABEL_GAP;
            pBox = pieceLabelBox(n);
            conflict = true;
          }
        }
        for (var p = 0; p < placed.length; p++){
          if (boxesOverlap(pBox, placed[p])) {
            n.y = placed[p].bottom + LABEL_HALF_H + LABEL_GAP;
            pBox = pieceLabelBox(n);
            conflict = true;
          }
        }
        guard++;
      }
      placed.push(pBox);
    });
  });
}

function resolveLabelOverlaps(visiblePieces){
  visiblePieces.forEach(function(n){ pieceLabelBox(n); }); // assigns labelSide
  stackBySide(visiblePieces);
  visiblePieces.forEach(function(n){
    n.x = clampX(n, n.x);
    n.y = clampY(n, n.y);
    pieceLabelBox(n); // finalize labelSide for rendering
  });
}

var svg = document.getElementById('graph');
svg.setAttribute('viewBox', '0 0 ' + VB_W + ' ' + VB_H);
var edgeLayer = document.getElementById('edges');
var nodeLayer = document.getElementById('nodes');
var NS = 'http://www.w3.org/2000/svg';
var expanded = {};
var openPieceId = null;
var isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
var allRepellers = families.map(function(f){ return nodeById[f.id]; }); // reset below once pieces exist

var piecePanel = document.getElementById('piece-panel');
var graphArrows = document.getElementById('graph-arrows');
var panelImages = document.getElementById('panel-images');
var panelContent = document.getElementById('panel-content');
var panelClose = document.getElementById('panel-close');

function closePanel(){
  openPieceId = null;
  piecePanel.classList.remove('open');
  graphArrows.classList.remove('open');
  panelImages.innerHTML = '';
  panelContent.innerHTML = '';
}
panelClose.addEventListener('click', closePanel);

function openPanel(piece){
  openPieceId = piece.id;
  piecePanel.classList.add('open');
  graphArrows.classList.add('open');

  var textHtml = '';
  if (piece.panelHtml) {
    textHtml += piece.panelHtml;
  } else {
    textHtml += '<h3>' + (piece.fullLabel || piece.label) + '</h3>';
    textHtml += '<p class="meta">' + piece.year + '</p>';
    textHtml += '<p>' + piece.forr + '</p>';
    textHtml += '<p class="meta">' + piece.where + '</p>';
    if (piece.url) {
      textHtml += '<p><a href="' + piece.url + '" target="_blank" rel="noopener">' + (piece.urlLabel || piece.url) + '</a></p>';
    }
  }
  panelContent.innerHTML = textHtml;

  if (piece.images && piece.images.length) {
    var imgHtml = '';
    piece.images.forEach(function(img){
      imgHtml += '<img src="' + img.src + '" alt="' + (img.alt || '') + '">';
    });
    panelImages.innerHTML = imgHtml;
  } else {
    panelImages.innerHTML = '';
  }

  requestAnimationFrame(function(){
    piecePanel.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  });
}

function clampX(n, v){
  return Math.max(n.r - SAFE_MARGIN, Math.min(SAFE_MARGIN * 2 - n.r, v));
}
function clampY(n, v){
  return Math.max(n.r - SAFE_MARGIN, Math.min(SAFE_MARGIN * 2 - n.r, v));
}

function drawEdges(){
  edgeLayer.innerHTML = '';
  // A piece is visible because at least one of its families is
  // open. Once it's visible, draw ALL of its connecting lines —
  // including to families that aren't open — so a piece linked to
  // a second family still shows that connection without opening
  // that family's other pieces. Only the piece's own visibility
  // depends on an open family; a line's visibility doesn't.
  var visiblePieceIds = {};
  pieces.forEach(function(p){
    if (p.links.some(function(fid){ return expanded[fid]; })) visiblePieceIds[p.id] = true;
  });
  edges.forEach(function(e){
    if (!visiblePieceIds[e.to]) return;
    var a = nodeById[e.from], b = nodeById[e.to];
    var line = document.createElementNS(NS,'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('stroke', a.color || '#000000');
    line.setAttribute('stroke-opacity', a.id === 'collabs' ? '0.6' : '0.3');
    line.setAttribute('stroke-width', '1');
    edgeLayer.appendChild(line);
  });
}

var nodeElements = {}; // id -> <g> element, so we can move existing nodes instead of recreating them

function positionNode(n, g, animate){
  n.x = clampX(n, n.x);
  n.y = clampY(n, n.y);
  if (!animate) g.style.transition = 'none';
  g.style.transform = 'translate(' + n.x + 'px,' + n.y + 'px)';
  if (!animate) {
    // force layout, then restore the transition for future moves
    g.getBoundingClientRect();
    g.style.transition = '';
  }
}

function updatePieceLabel(n, textEl){
  var side = n.labelSide === -1 ? -1 : 1;
  if (side === 1) {
    textEl.setAttribute('text-anchor', 'start');
    textEl.setAttribute('x', n.r + 6);
  } else {
    textEl.setAttribute('text-anchor', 'end');
    textEl.setAttribute('x', -(n.r + 6));
  }
}

function createNode(n){
  var g = document.createElementNS(NS,'g');
  var isFamily = n.type === 'family';
  g.setAttribute('class', isFamily ? 'family-node' : 'piece-node');
  if (isFamily && expanded[n.id]) g.classList.add('expanded');

  var circle = document.createElementNS(NS,'circle');
  circle.setAttribute('r', n.r);
  if (isFamily) {
    circle.setAttribute('fill', n.color);
    circle.setAttribute('stroke', 'none');
    circle.setAttribute('stroke-width', '0');
  } else {
    circle.setAttribute('fill', '#ffffff');
    circle.setAttribute('stroke', '#000000');
    circle.setAttribute('stroke-width', '1.2');
  }
  g.appendChild(circle);

  if (isFamily) {
    var label = document.createElementNS(NS,'text');
    label.textContent = n.label;
    label.setAttribute('class', 'f-label');
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('y', -(n.r + 8));
    label.setAttribute('font-family', 'Courier New, Courier, monospace');
    label.setAttribute('font-size', '12');
    label.setAttribute('fill', '#000000');
    g.appendChild(label);
  } else {
    var text = document.createElementNS(NS,'text');
    text.textContent = n.fullLabel || n.label;
    text.setAttribute('class', 'p-label');
    text.setAttribute('dy', '0.35em');
    text.setAttribute('font-family', 'Helvetica Neue, Helvetica, Arial, sans-serif');
    text.setAttribute('font-size', '11');
    text.setAttribute('fill', '#000000');
    g.appendChild(text);
    updatePieceLabel(n, text);
  }

  nodeLayer.appendChild(g);
  g.style.cursor = 'pointer';
  nodeElements[n.id] = g;

  var dragging = false, offX = 0, offY = 0, moved = 0;
  function toSvgPoint(evt){
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  g.addEventListener('pointerdown', function(evt){
    if (isTouchDevice) return;
    evt.preventDefault();
    dragging = true;
    moved = 0;
    g.setPointerCapture(evt.pointerId);
    var p = toSvgPoint(evt);
    offX = n.x - p.x; offY = n.y - p.y;
    g.style.cursor = 'grabbing';
  });
  g.addEventListener('pointermove', function(evt){
    if (!dragging) return;
    var p = toSvgPoint(evt);
    var newX = clampX(n, p.x + offX);
    var newY = clampY(n, p.y + offY);
    moved += Math.abs(newX - n.x) + Math.abs(newY - n.y);
    n.x = newX; n.y = newY;
    positionNode(n, g, false);
    drawEdges();
  });
  g.addEventListener('pointerup', function(){
    dragging = false;
    g.style.cursor = 'pointer';
    if (moved < 4) {
      if (isFamily) {
        toggleFamily(n.id);
      } else {
        if (openPieceId === n.id) { closePanel(); } else { openPanel(n); }
      }
    }
  });

  return g;
}

function visiblePieceList(){
  return pieces
    .map(function(p){ return nodeById[p.id]; })
    .filter(function(n){ return n.links.some(function(fid){ return expanded[fid]; }); });
}

var MAX_OPEN_FAMILIES = 3;
var openOrder = []; // tracks which families are open, oldest first

function toggleFamily(id){
  if (expanded[id]) {
    expanded[id] = false;
    openOrder = openOrder.filter(function(fid){ return fid !== id; });
  } else {
    expanded[id] = true;
    openOrder.push(id);
    while (openOrder.length > MAX_OPEN_FAMILIES) {
      var oldest = openOrder.shift();
      expanded[oldest] = false;
    }
  }
  render();
}

// Closed families always sit exactly on their home ring position —
// that's the stable default look. When several crowded families are
// open together, they're allowed to spread apart from each other a
// little (a spring pulls each one back toward home, so it only
// drifts as far as the crowding actually requires) — giving the
// whole layout real room instead of forcing every fix onto the
// pieces alone.
function repositionOpenFamilies(){
  var openFamilies = families.map(function(f){ return nodeById[f.id]; }).filter(function(f){ return expanded[f.id]; });

  families.forEach(function(f){
    var n = nodeById[f.id];
    if (!expanded[f.id]) { n.x = n.homeX; n.y = n.homeY; }
  });

  if (openFamilies.length < 2) {
    openFamilies.forEach(function(f){ f.x = f.homeX; f.y = f.homeY; });
    return;
  }

  openFamilies.forEach(function(f){ f.x = f.homeX; f.y = f.homeY; f.vx = 0; f.vy = 0; });
  var FORCE_K = 0.9, SPRING_F = 0.05, TICKS_F = 80;
  for (var t = 0; t < TICKS_F; t++){
    var alpha = Math.max(1 - t / TICKS_F, 0.05);
    for (var i = 0; i < openFamilies.length; i++){
      for (var j = i + 1; j < openFamilies.length; j++){
        var a = openFamilies[i], b = openFamilies[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        // "wanted space" is how far each family's pieces actually
        // spread (not the tiny dot radius) — two families whose
        // piece clouds would overlap push apart; two that are
        // already clear of each other feel nothing and stay home.
        var wantedSpace = linkDistanceFor(a.id) + linkDistanceFor(b.id) + 55;
        var shortfall = wantedSpace - dist;
        if (shortfall <= 0) continue;
        var ux = dx / dist, uy = dy / dist;
        var force = FORCE_K * alpha * shortfall;
        a.vx += ux * force; a.vy += uy * force;
        b.vx -= ux * force; b.vy -= uy * force;
      }
    }
    openFamilies.forEach(function(f){
      f.vx += (f.homeX - f.x) * SPRING_F * alpha;
      f.vy += (f.homeY - f.y) * SPRING_F * alpha;
      f.vx *= 0.75; f.vy *= 0.75;
      f.x += f.vx; f.y += f.vy;
    });
  }
}

function render(){
  var visible = visiblePieceList();

  // newly-appearing pieces get seeded near their family before the
  // settle pass, so they arrive from a sensible place rather than
  // materialising mid-air
  visible.forEach(function(n){
    if (!n.everPositioned) {
      var anchor = nodeById[n.links[0]];
      var angle = Math.random() * 2 * Math.PI;
      n.x = anchor.x + 20 * Math.cos(angle);
      n.y = anchor.y + 20 * Math.sin(angle);
      n.everPositioned = true;
    }
  });

  allRepellers = families.map(function(f){ return nodeById[f.id]; });
  repositionOpenFamilies();
  if (visible.length) settlePieces(visible);

  var visibleIds = {};
  families.forEach(function(f){ visibleIds[f.id] = true; });
  visible.forEach(function(n){ visibleIds[n.id] = true; });

  // remove nodes that should no longer be shown
  Object.keys(nodeElements).forEach(function(id){
    if (!visibleIds[id]) {
      nodeElements[id].remove();
      delete nodeElements[id];
    }
  });

  // families: never re-created, just kept in sync (expanded class)
  families.forEach(function(f){
    var n = nodeById[f.id];
    var g = nodeElements[f.id];
    if (!g) { g = createNode(n); positionNode(n, g, false); }
    else { positionNode(n, g, true); }
    g.classList.toggle('expanded', !!expanded[f.id]);
  });

  // pieces: move existing ones (animated), create new ones (not animated)
  visible.forEach(function(n){
    var g = nodeElements[n.id];
    if (g) {
      positionNode(n, g, true);
      var labelEl = g.querySelector('.p-label');
      if (labelEl) updatePieceLabel(n, labelEl);
    } else {
      g = createNode(n);
      positionNode(n, g, false);
    }
  });

  fitViewBox(visible);
  drawEdges();
}

// The canvas grows to fit whatever's currently open, rather than
// squeezing labels into a fixed box (which is what caused text to
// overlap when a lot was expanded at once). Never shrinks below the
// default VB_W x VB_H size — it only ever grows outward from there.
// The canvas grows to fit whatever's open, but never shrinks back
// down again — once it's grown to hold a busy moment, it stays that
// size. Only the dots move after that; the box itself doesn't jump
// around, which is what "organic" movement actually requires.
var savedBounds = null;
function fitViewBox(visiblePieces){
  var pad = 24;
  var minX = CENTER_X - VB_W / 2, maxX = CENTER_X + VB_W / 2;
  var minY = CENTER_Y - VB_H / 2, maxY = CENTER_Y + VB_H / 2;

  families.forEach(function(f){
    var box = familyLabelBox(nodeById[f.id]);
    minX = Math.min(minX, box.left); maxX = Math.max(maxX, box.right);
    minY = Math.min(minY, box.top); maxY = Math.max(maxY, box.bottom);
  });
  visiblePieces.forEach(function(n){
    var box = pieceLabelBox(n);
    minX = Math.min(minX, box.left); maxX = Math.max(maxX, box.right);
    minY = Math.min(minY, box.top); maxY = Math.max(maxY, box.bottom);
  });

  minX -= pad; minY -= pad; maxX += pad; maxY += pad;

  if (savedBounds) {
    minX = Math.min(minX, savedBounds.minX);
    minY = Math.min(minY, savedBounds.minY);
    maxX = Math.max(maxX, savedBounds.maxX);
    maxY = Math.max(maxY, savedBounds.maxY);
  }

  // Cap the box at a hard maximum size, relative to the default —
  // applied to the ACCUMULATED total, after merging with history,
  // not just to what this one render needed. Capping only the
  // per-render contribution and then merging that into a total that
  // itself has no cap is exactly how this kept climbing: each newly
  // opened family added its own capped sliver, but nothing ever
  // capped the running sum. This is what actually stops "zoom out."
  var MAX_GROWTH = 1.6;
  var maxW = VB_W * MAX_GROWTH, maxH = VB_H * MAX_GROWTH;
  if ((maxX - minX) > maxW) { var cx = (minX + maxX) / 2; minX = cx - maxW / 2; maxX = cx + maxW / 2; }
  if ((maxY - minY) > maxH) { var cy = (minY + maxY) / 2; minY = cy - maxH / 2; maxY = cy + maxH / 2; }

  savedBounds = { minX: minX, minY: minY, maxX: maxX, maxY: maxY };

  svg.setAttribute('viewBox', minX + ' ' + minY + ' ' + (maxX - minX) + ' ' + (maxY - minY));
}

render();

// ---------- plain-list view: generated from the same data as the ----------
// graph above, so a new piece only ever needs adding in one place.
// Two orderings: by family (matches the graph's fixed order) and by
// year (chronological; each title gets a small dot in its family's
// colour, but the year headings themselves stay neutral).
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function pieceMetaLine(p){
  if (p.note) return p.note;
  var parts = [];
  if (p.forr) parts.push(p.forr);
  if (p.where) parts.push(p.where);
  return parts.join(' — ');
}

function pieceListItem(p, withDot){
  var dot = withDot
    ? '<span class="piece-dot" style="background-color:' + nodeById[p.links[0]].color + '"></span>'
    : '';
  var meta = pieceMetaLine(p);
  return '<li>' + dot + (p.fullLabel || p.label) +
    (meta ? '<br><span class="meta">' + meta + '</span>' : '') +
    '</li>';
}

function renderListByFamily(){
  var html = '';
  families.forEach(function(f, i){
    var members = pieces.filter(function(p){ return p.links.indexOf(f.id) !== -1; });
    if (!members.length) return;
    html += '<details' + (i === 0 ? ' open' : '') + '>' +
      '<summary style="border-left: 4px solid ' + f.color + '; padding-left: 10px;">' + cap(f.label) + '</summary>' +
      '<ul class="recent">' + members.map(function(p){ return pieceListItem(p, false); }).join('') + '</ul>' +
      '</details>';
  });
  document.getElementById('list-content').innerHTML = html;
}

function renderListByYear(){
  var byYear = {};
  var yearOrder = [];
  pieces.forEach(function(p){
    var y = p.year || 'TBA';
    if (!byYear[y]) { byYear[y] = []; yearOrder.push(y); }
    byYear[y].push(p);
  });
  yearOrder.sort(function(a, b){
    var na = parseInt(a, 10), nb = parseInt(b, 10);
    if (isNaN(na)) return 1;   // non-numeric (TBA) sinks to the end
    if (isNaN(nb)) return -1;
    return nb - na;            // most recent first
  });
  var html = '';
  yearOrder.forEach(function(y, i){
    html += '<details' + (i === 0 ? ' open' : '') + '>' +
      '<summary style="border-left: 4px solid var(--ink); opacity: 0.55; padding-left: 10px;">' + y + '</summary>' +
      '<ul class="recent">' + byYear[y].map(function(p){ return pieceListItem(p, true); }).join('') + '</ul>' +
      '</details>';
  });
  document.getElementById('list-content').innerHTML = html;
}

var showByFamilyBtn = document.getElementById('show-by-family');
var showByYearBtn = document.getElementById('show-by-year');
showByFamilyBtn.addEventListener('click', function(){
  renderListByFamily();
  showByFamilyBtn.classList.add('active');
  showByYearBtn.classList.remove('active');
});
showByYearBtn.addEventListener('click', function(){
  renderListByYear();
  showByYearBtn.classList.add('active');
  showByFamilyBtn.classList.remove('active');
});

renderListByFamily();
</script>
